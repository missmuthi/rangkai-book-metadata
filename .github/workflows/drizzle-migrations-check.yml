name: Drizzle Migrations Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  drizzle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Generate Drizzle Migration to Temp Directory
        run: |
          npm run db:migrate:drizzle --silent
          npx drizzle-kit generate --schema ./src/lib/server/db/schema.ts --out ./drizzle-temp --driver d1-http --dialect sqlite
      - name: Check for Diff between migrations and generated
        run: |
          if [ -d ./migrations ]; then
            git --no-pager diff --no-index --name-only ./migrations ./drizzle-temp || (echo "Migration drift detected. Run 'npm run db:migrate:drizzle' to update migrations." && exit 1)
          else
            echo "No migrations dir found; creating migrations from generated output..."
            cp -r ./drizzle-temp ./migrations
            echo "Migrations generated; please review and commit changes if this is intended."
            exit 1
          fi
